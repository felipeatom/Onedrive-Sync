[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onedrive-sync"
version = "0.1.0"
description = "Onedrive-Sync client for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "msal>=1.26",
    "requests>=2.31",
    "watchdog>=4.0",
    "PyQt6>=6.6",
    "appdirs>=1.4",
    "python-dateutil>=2.8",
]

[project.scripts]
onedrive-sync = "onedrive_atom.main:main"
onedrive-sync-cli = "onedrive_atom.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["onedrive_atom*"]

[tool.setuptools.package-data]
onedrive_atom = ["resources/icons/*.svg"]
